<style>
:root{

*{box-sizing:border-box}

body{overflow-x:hidden}
button,input,textarea,select{font:inherit}
button{color:inherit}

.hidden{display:none!important}
.muted{color:var(--muted)}

.splash{

}
.splash .logo-mark{width:64px;height:64px}

.rail{
  position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:60;
  background:#000;border-right:1px solid rgba(255,255,255,.025);
  display:flex;flex-direction:column;align-items:center;padding:10px 0 max(12px,env(safe-area-inset-bottom));
}
.brand-button,.nav-icon,.utility-btn{
  width:38px;height:38px;border:0;background:transparent;border-radius:12px;
  display:grid;place-items:center;cursor:pointer;color:#767676;
  transition:color .16s ease,background .16s ease,opacity .16s ease
}
.brand-button{margin-bottom:48px}
.brand-button .logo-mark{width:26px;height:26px}
.nav-stack{display:flex;flex-direction:column;gap:13px}
.nav-icon:hover,.utility-btn:hover{color:#d9d9d9;background:#0b0b0b}
.nav-icon.active{color:#fff}
.nav-icon svg,.utility-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}
.rail-bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:12px}
.avatar-mini{
  width:24px;height:24px;border-radius:50%;overflow:hidden;border:1px solid rgba(255,255,255,.18);
  display:grid;place-items:center;background:
  radial-gradient(circle at 62% 38%,#dba66c 0 12%,transparent 13%),
  radial-gradient(circle at 46% 48%,#f4d0a1 0 21%,transparent 22%),
  linear-gradient(135deg,#42352e,#12100f 58%,#514034)
}
.avatar-mini::after{content:"";width:10px;height:10px;border-radius:50%;background:#151515}

.main{
  min-height:100vh;margin-left:var(--rail);position:relative;background:#000;
}
.page{display:none;min-height:100vh;padding-bottom:122px}
.page.active{display:block}

.topbar{
  height:58px;display:flex;align-items:center;padding:0 10px;position:sticky;top:0;z-index:30;
  pointer-events:none;background:linear-gradient(#000 0%,rgba(0,0,0,.82) 68%,transparent 100%)
}
.topbar>*{pointer-events:auto}
.feed-selector{
  border:1px solid rgba(255,255,255,.08);background:rgba(72,72,72,.74);color:#fff;
  border-radius:18px;padding:9px 14px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px;
  backdrop-filter:blur(16px);cursor:pointer;transition:background .16s ease
}
.feed-selector:hover{background:rgba(86,86,86,.82)}
.feed-selector svg{width:12px;height:12px;stroke:currentColor;fill:none}

.feed-wrap{padding:0 3px 0 2px}
.masonry{
  column-count:4;column-gap:3px;
}
.tile{
  break-inside:avoid;position:relative;margin:0 0 3px;overflow:hidden;background:#101010;
  cursor:pointer;min-height:180px;isolation:isolate;
}
.tile-media{
  width:100%;aspect-ratio:var(--ratio,9/13);position:relative;overflow:hidden;
  background:
    radial-gradient(circle at var(--x1,28%) var(--y1,22%),var(--c1,#7c5f42) 0 4%,transparent 26%),
    radial-gradient(circle at var(--x2,72%) var(--y2,68%),var(--c2,#2f6f71) 0 5%,transparent 30%),
    linear-gradient(var(--deg,145deg),var(--c3,#161616),var(--c4,#4d4d4d));
}
.tile-media::before{
  content:"";position:absolute;inset:-30%;
  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.06) 50%,transparent 65%);
  transform:translateX(-50%) rotate(8deg);opacity:0;transition:opacity .18s ease;
}
.tile:hover .tile-media::before{opacity:1;animation:sheen 2.2s linear infinite}
@keyframes sheen{to{transform:translateX(55%) rotate(8deg)}}
.tile-media::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.05) 33%,rgba(0,0,0,0) 55%);
  pointer-events:none
}
.tile[data-scene="1"] .tile-media{
  background:
  radial-gradient(ellipse at 53% 70%,rgba(226,191,119,.64) 0 9%,transparent 10%),
  radial-gradient(ellipse at 50% 48%,rgba(130,92,48,.8) 0 14%,transparent 15%),
  linear-gradient(180deg,#eef0ec 0 35%,#b8b8b2 36% 43%,#5f513a 44% 70%,#26231e);
}
.tile[data-scene="2"] .tile-media{
  background:
  radial-gradient(circle at 68% 20%,#f2e1a4 0 7%,transparent 8%),
  linear-gradient(180deg,#050508 0 38%,#1d1a20 39% 58%,#392c2a 59% 100%);
}
.tile[data-scene="3"] .tile-media{
  background:
  linear-gradient(90deg,transparent 47%,rgba(229,239,242,.86) 48% 53%,transparent 54%),
  linear-gradient(180deg,#b4d8eb 0 31%,#6a8cab 32% 50%,#243144 51% 100%);
}
.tile[data-scene="4"] .tile-media{
  background:
  radial-gradient(ellipse at 72% 77%,#c8b08a 0 9%,transparent 10%),
  radial-gradient(ellipse at 48% 56%,#d9c8b6 0 15%,transparent 16%),
  linear-gradient(155deg,#f2f0e8 0 45%,#b6a07e 46% 65%,#403b31);
}
.tile[data-scene="5"] .tile-media{
  background:
  radial-gradient(circle at 50% 46%,rgba(255,95,29,.72) 0 7%,transparent 24%),
  linear-gradient(180deg,#08090d 0 36%,#2f0905 37% 72%,#17100b);
}
.tile[data-scene="6"] .tile-media{
  background:
  linear-gradient(180deg,#1c1b1e 0 45%,#888 46% 47%,#232323 48% 100%),
  repeating-linear-gradient(90deg,transparent 0 6%,rgba(255,255,255,.06) 7% 8%);
}
.tile[data-scene="7"] .tile-media{
  background:
  radial-gradient(circle at 40% 68%,rgba(244,152,178,.34) 0 12%,transparent 13%),
  radial-gradient(circle at 70% 35%,rgba(255,225,163,.55) 0 5%,transparent 22%),
  linear-gradient(150deg,#4a3153,#1e2b4a 45%,#0d1017);
}
.tile[data-scene="8"] .tile-media{
  background:
  linear-gradient(110deg,#161616 0 39%,#21413d 40% 63%,#bec6bd 64% 100%);
}
.tile[data-scene="9"] .tile-media{
  background:
  radial-gradient(circle at 45% 26%,rgba(243,225,174,.7) 0 6%,transparent 7%),
  radial-gradient(ellipse at 50% 60%,rgba(91,66,42,.9) 0 15%,transparent 16%),
  linear-gradient(180deg,#0a0b0b,#3f3529);
}
.tile[data-scene="10"] .tile-media{
  background:
  repeating-linear-gradient(90deg,#2c4435 0 8%,#1e3027 9% 16%),
  linear-gradient(#122018,#273d2d);
}
.tile[data-scene="11"] .tile-media{
  background:
  radial-gradient(circle at 58% 44%,rgba(195,216,225,.38) 0 9%,transparent 10%),
  linear-gradient(145deg,#889eab,#3b4850 48%,#181d22);
}
.tile[data-scene="12"] .tile-media{
  background:
  radial-gradient(ellipse at 48% 68%,rgba(254,201,131,.6) 0 12%,transparent 13%),
  linear-gradient(180deg,#39200f 0 41%,#70452c 42% 72%,#17110c);
}

.tile-topmark{
  position:absolute;left:10px;top:10px;z-index:3;display:flex;align-items:center;gap:5px;
  font-size:9px;font-weight:700;color:rgba(255,255,255,.86);opacity:.8;
}
.tile-topmark .logo-mark{width:17px;height:17px}
.tile-overlay{
  position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:flex-end;justify-content:space-between;
  padding:34px 11px 9px;color:#fff;font-size:10px;font-weight:650;gap:8px
}
.creator{
  min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:40%;
}
.tile-actions{display:flex;align-items:center;gap:10px;white-space:nowrap}
.mini-action{display:flex;align-items:center;gap:3px;border:0;background:none;padding:0;color:#fff;cursor:pointer;font-size:9px}
.mini-action svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9}
.mini-action.liked svg{fill:#fff}
.tile-generation{
  position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:flex-end;
  padding:16px;background:linear-gradient(to top,rgba(0,0,0,.86),rgba(0,0,0,.1));
}
.gen-label{font-size:11px;font-weight:700;margin-bottom:7px}
.gen-progress{height:3px;background:rgba(255,255,255,.16);border-radius:99px;overflow:hidden}
.gen-progress>i{display:block;height:100%;width:var(--p,10%);background:#fff;border-radius:inherit;transition:width .8s ease}

.composer{
  position:fixed;z-index:70;left:calc(var(--rail) + (100vw - var(--rail))/2);transform:translateX(-50%);
  bottom:max(24px,env(safe-area-inset-bottom));width:var(--composer-w);
  border:1px solid rgba(255,255,255,.09);border-radius:24px;
  background:linear-gradient(115deg,rgba(52,45,42,.87),rgba(43,47,45,.88) 55%,rgba(39,42,44,.9));
  box-shadow:0 18px 55px rgba(0,0,0,.54),inset 0 1px rgba(255,255,255,.035);
  backdrop-filter:blur(22px) saturate(115%);
  padding:14px 14px 10px;transition:opacity .18s ease,transform .18s ease,bottom .18s ease;
}
.composer.subdued{opacity:.55}
.prompt{
  border:0;outline:0;background:transparent;color:#f0f0f0;width:100%;resize:none;
  min-height:42px;max-height:120px;padding:0 3px;font-size:13px;line-height:1.45
}
.prompt::placeholder{color:#aaa}
.composer-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
.circle-btn{
  width:34px;height:34px;border-radius:50%;border:0;display:grid;place-items:center;
  background:rgba(255,255,255,.08);color:#e8e8e8;cursor:pointer;transition:background .16s ease,color .16s ease,opacity .16s ease
}
.circle-btn:hover{background:rgba(255,255,255,.14)}
.circle-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}
.composer-right{display:flex;gap:7px}
.send-btn{background:rgba(255,255,255,.08);color:#666}
.send-btn.ready{background:#f1f1f1;color:#111}
.send-btn.ready:hover{background:#fff}
.settings-popover{
  position:fixed;z-index:75;width:330px;max-width:calc(100vw - 28px);
  border:1px solid var(--border);background:rgba(18,18,18,.96);border-radius:18px;
  box-shadow:var(--shadow);backdrop-filter:blur(24px);padding:13px;
}
.settings-title{font-size:12px;font-weight:750;margin:1px 2px 10px}
.setting-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.field label{display:block;font-size:9px;color:#888;margin:0 0 5px 2px}
.field select,.field input{
  width:100%;border:1px solid rgba(255,255,255,.09);border-radius:10px;background:#0b0b0b;color:#ededed;
  padding:9px 10px;outline:none;font-size:11px
}
.field select:focus,.field input:focus{border-color:rgba(255,255,255,.2)}
.attachments{display:flex;gap:6px;flex-wrap:wrap;padding:0 2px 7px}
.attach-chip{
  display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);
  border-radius:999px;padding:5px 8px;font-size:9px;color:#ddd
}
.attach-chip button{border:0;background:none;color:#888;padding:0;cursor:pointer}

.search-shell,.activity-shell,.drafts-shell,.characters-shell{padding:16px 28px 110px;max-width:1240px;margin:0 auto}
.page-title-row{height:50px;display:flex;align-items:center;gap:9px;font-size:15px;font-weight:750}
.back-btn{width:30px;height:30px;border:0;border-radius:50%;background:transparent;color:#eee;display:grid;place-items:center;cursor:pointer}
.back-btn:hover{background:#111}
.back-btn svg{width:18px;height:18px;stroke:currentColor;fill:none}
.searchbar{
  width:min(650px,100%);position:relative;margin:2px 0 18px
}
.searchbar input{
  width:100%;background:#121212;border:1px solid rgba(255,255,255,.09);border-radius:14px;color:#eee;
  outline:none;padding:12px 14px 12px 40px;font-size:13px
}
.searchbar svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:#777;fill:none}
.search-filters{display:flex;gap:7px;margin-bottom:16px;overflow:auto}
.filter-chip{
  border:1px solid rgba(255,255,255,.09);background:#0d0d0d;color:#909090;border-radius:999px;padding:7px 11px;
  cursor:pointer;font-size:10px;white-space:nowrap
}
.filter-chip.active{color:#fff;background:#1d1d1d;border-color:rgba(255,255,255,.16)}
.search-suggestions{
  position:absolute;left:0;right:0;top:48px;z-index:20;background:#111;border:1px solid var(--border);
  border-radius:14px;padding:6px;box-shadow:var(--shadow)
}
.suggestion{padding:9px;border-radius:9px;font-size:11px;color:#aaa;cursor:pointer}
.suggestion:hover{background:#1a1a1a;color:#fff}

.activity-list{max-width:720px}
.activity-item{display:flex;align-items:center;gap:11px;padding:13px 3px;border-bottom:1px solid rgba(255,255,255,.055)}
.activity-avatar{
  width:36px;height:36px;border-radius:50%;flex:0 0 auto;background:linear-gradient(135deg,var(--a,#555),var(--b,#222))
}
.activity-copy{font-size:11px;line-height:1.45;flex:1}
.activity-copy b{font-weight:750}
.activity-time{color:#656565;font-size:9px;margin-top:2px}
.activity-thumb{width:42px;height:54px;border-radius:4px;background:linear-gradient(140deg,var(--a,#333),var(--b,#777))}

.profile-shell{
  max-width:720px;margin:0 auto;padding:14px 24px 110px;text-align:center
}
.profile-handle{font-weight:700;font-size:14px;margin:2px 0 18px}
.profile-avatar-wrap{position:relative;width:142px;height:142px;margin:0 auto 22px}
.profile-avatar{
  width:142px;height:142px;border-radius:50%;background:
  radial-gradient(circle at 55% 39%,#d3ae7b 0 8%,transparent 9%),
  radial-gradient(circle at 42% 48%,#dbb582 0 19%,transparent 20%),
  linear-gradient(145deg,#49677d 0 35%,#724830 36% 64%,#241f1b 65% 100%);
  border:1px solid rgba(255,255,255,.12)
}
.profile-edit{
  position:absolute;right:4px;bottom:7px;width:39px;height:39px;border-radius:50%;border:2px solid #000;background:#1b1b1b;
  display:grid;place-items:center;color:#fff;cursor:pointer
}
.profile-edit svg{width:17px;height:17px;stroke:currentColor;fill:none}
.display-name{font-size:27px;font-weight:780;letter-spacing:-.02em}
.bio{margin-top:9px;font-size:14px;color:#ddd}
.stats{
  display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:27px auto 19px;max-width:450px
}
.stat-num{font-size:27px;line-height:1;font-weight:800}
.stat-label{font-size:10px;margin-top:6px;color:#ececec}
.profile-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:430px;margin:0 auto 25px}
.outline-pill{
  border:1px solid rgba(255,255,255,.18);background:#030303;border-radius:999px;padding:13px 18px;
  color:#f1f1f1;font-size:12px;font-weight:700;cursor:pointer
}
.outline-pill:hover{background:#0d0d0d}
.profile-tabs{display:flex;justify-content:center;gap:22px;margin:0 auto 20px;border-bottom:1px solid rgba(255,255,255,.045)}
.profile-tab{
  border:0;background:none;color:#6f6f6f;padding:13px 2px 14px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer
}
.profile-tab.active{color:#fff}
.profile-tab svg{width:19px;height:19px;stroke:currentColor;fill:none}
.profile-grid{column-count:3;column-gap:4px;text-align:left}
.profile-grid .tile{margin-bottom:4px}

.drafts-grid{
  display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:5px;margin-top:86px;min-height:55vh
}
.draft{
  aspect-ratio:16/9;position:relative;overflow:hidden;background:
  radial-gradient(circle at var(--dx,50%) var(--dy,45%),var(--dc,#92735f) 0 9%,transparent 20%),
  linear-gradient(145deg,var(--d1,#232323),var(--d2,#666));
  cursor:pointer
}
.draft::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.38);opacity:0;transition:opacity .16s ease}
.draft:hover::after{opacity:1}
.draft-controls{
  position:absolute;inset:auto 7px 7px;z-index:3;display:flex;gap:5px;opacity:0;transform:translateY(4px);
  transition:opacity .16s ease,transform .16s ease;flex-wrap:wrap
}
.draft:hover .draft-controls{opacity:1;transform:none}
.draft-btn{border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.72);color:#fff;border-radius:7px;padding:5px 7px;font-size:8px;cursor:pointer}

.characters-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:920px
}
.character-card{
  border:1px solid rgba(255,255,255,.075);border-radius:16px;background:#080808;padding:14px;text-align:left
}
.character-top{display:flex;gap:11px;align-items:center}
.character-avatar{
  width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--a,#666),var(--b,#222));flex:0 0 auto
}
.character-name{font-size:13px;font-weight:750}
.character-handle{font-size:9px;color:#777;margin-top:3px}
.character-desc{font-size:10px;line-height:1.45;color:#aaa;margin:12px 0}
.character-meta{display:flex;justify-content:space-between;color:#686868;font-size:9px}
.character-edit{margin-top:11px;width:100%;border:1px solid rgba(255,255,255,.12);background:#111;border-radius:10px;padding:8px;cursor:pointer;font-size:10px}
.character-edit:hover{background:#181818}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:110;display:grid;place-items:center;
  padding:18px;animation:fade .15s ease
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.viewer{
  width:min(1100px,100%);height:min(780px,calc(100vh - 36px));background:#050505;border:1px solid rgba(255,255,255,.09);
  border-radius:16px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 300px;box-shadow:0 30px 100px rgba(0,0,0,.6)
}
.viewer-media{position:relative;display:grid;place-items:center;background:#000;overflow:hidden}
.viewer-art{
  width:100%;height:100%;max-height:100%;background:
  radial-gradient(circle at 70% 30%,var(--vc1,#88715d) 0 7%,transparent 22%),
  radial-gradient(circle at 38% 68%,var(--vc2,#2f6e69) 0 8%,transparent 30%),
  linear-gradient(145deg,var(--vc3,#151515),var(--vc4,#545454));
}
.viewer-side{padding:18px;display:flex;flex-direction:column;border-left:1px solid rgba(255,255,255,.065)}
.viewer-user{font-size:12px;font-weight:750}
.viewer-prompt{font-size:11px;color:#b3b3b3;line-height:1.5;margin-top:12px}
.viewer-social{display:flex;gap:8px;margin-top:auto}
.viewer-social button{flex:1;border:1px solid rgba(255,255,255,.1);background:#0c0c0c;border-radius:11px;padding:9px;color:#ddd;cursor:pointer}
.viewer-close{
  position:absolute;right:16px;top:16px;z-index:120;width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.58);color:#fff;display:grid;place-items:center;cursor:pointer
}
.viewer-close svg{width:18px;height:18px;stroke:currentColor;fill:none}

.editor{
  width:min(560px,100%);background:#0a0a0a;border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow)
}
.editor h2{font-size:17px;margin:0 0 15px}
.editor textarea{width:100%;min-height:90px;background:#111;border:1px solid rgba(255,255,255,.1);color:#eee;border-radius:10px;padding:10px;resize:vertical}
.editor-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.editor-actions button{border:1px solid rgba(255,255,255,.11);background:#151515;color:#eee;border-radius:10px;padding:9px 13px;cursor:pointer}
.editor-actions .primary{background:#f2f2f2;color:#111}

.toast-stack{position:fixed;right:18px;bottom:18px;z-index:150;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  background:#171717;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;font-size:10px;color:#eee;
  box-shadow:var(--shadow);animation:toastin .2s ease
}
@keyframes toastin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

@media(max-width:1080px){
  .masonry{column-count:3}
  .profile-grid{column-count:3}
  .drafts-grid{grid-template-columns:repeat(2,1fr)}
  .characters-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:780px){
  :root{--rail:0px;--composer-w:calc(100vw - 24px)}
  .rail{
    top:auto;bottom:0;left:0;right:0;width:100%;height:58px;flex-direction:row;justify-content:space-around;
    padding:4px max(6px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));
    border-right:0;border-top:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.96);backdrop-filter:blur(16px)
  }
  .brand-button{display:none}
  .nav-stack{display:flex;flex-direction:row;gap:14px}
  .rail-bottom{margin:0;flex-direction:row;gap:14px}
  .utility-btn{display:none}
  .main{margin-left:0}
  .page{padding-bottom:170px}
  .topbar{height:50px;padding:0 8px}
  .masonry{column-count:2;column-gap:2px}
  .tile{margin-bottom:2px}
  .tile-overlay{padding:28px 8px 7px}
  .tile-actions{gap:6px}
  .mini-action:nth-child(2),.mini-action:nth-child(3){display:none}
  .composer{left:50%;bottom:70px;border-radius:20px;padding:12px}
  .settings-popover{bottom:142px!important;left:12px!important;right:12px!important;width:auto!important}
  .search-shell,.activity-shell,.drafts-shell,.characters-shell{padding:8px 13px 160px}
  .profile-shell{padding:10px 14px 165px}
  .profile-avatar-wrap,.profile-avatar{width:112px;height:112px}
  .profile-edit{width:34px;height:34px}
  .display-name{font-size:23px}
  .stats{gap:6px}
  .stat-num{font-size:22px}
  .drafts-grid{grid-template-columns:repeat(2,1fr);margin-top:32px}
  .characters-grid{grid-template-columns:1fr}
  .profile-grid{column-count:2}
  .viewer{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;height:calc(100vh - 24px)}
  .viewer-side{border-left:0;border-top:1px solid rgba(255,255,255,.06);max-height:190px}
}
@media(max-width:470px){
  .masonry{column-count:1}
  .feed-wrap{padding:0}
  .tile{margin-bottom:2px}
  .tile-media{aspect-ratio:9/13!important}
  .profile-actions{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat-label{font-size:8px}
  .profile-tabs{gap:22px}
}

/* ===== clean/private mode revision ===== */
.brand-button,.nav-icon,.utility-btn,.circle-btn,.profile-edit,.back-btn{
  background:rgba(18,18,18,.38)!important;
  border:1px solid rgba(255,255,255,.075)!important;
  backdrop-filter:blur(16px) saturate(125%);
  -webkit-backdrop-filter:blur(16px) saturate(125%);
}
.nav-icon:hover,.utility-btn:hover,.brand-button:hover,.circle-btn:hover,.profile-edit:hover,.back-btn:hover{
  background:rgba(38,38,38,.52)!important;
}
.feed-selector{
  background:rgba(50,50,50,.38)!important;
  backdrop-filter:blur(18px) saturate(120%);
  -webkit-backdrop-filter:blur(18px) saturate(120%);
}
.outline-pill{
  background:rgba(10,10,10,.34)!important;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.empty-state{
  min-height:calc(100vh - 190px);
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:40px 20px;
}
.empty-inner{max-width:420px;color:#707070}
.empty-inner .logo-mark{width:40px;height:40px;opacity:.52;margin-bottom:18px}
.empty-inner h2{margin:0 0 8px;color:#d8d8d8;font-size:17px;font-weight:700}
.empty-inner p{margin:0;color:#717171;font-size:11px;line-height:1.55}
.empty-action{
  margin-top:16px;border:1px solid rgba(255,255,255,.11);
  background:rgba(255,255,255,.055);color:#dcdcdc;
  border-radius:999px;padding:9px 14px;font-size:10px;cursor:pointer;
  backdrop-filter:blur(12px)
}
.auth-chip{
  position:fixed;right:14px;top:12px;z-index:72;
  display:flex;align-items:center;gap:8px;
}
.auth-btn{
  border:1px solid rgba(255,255,255,.1);
  background:rgba(23,23,23,.42);color:#eee;border-radius:999px;
  padding:9px 13px;font-size:10px;font-weight:700;cursor:pointer;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)
}
.auth-btn:hover{background:rgba(42,42,42,.56)}
.private-pill{
  border:1px solid rgba(255,255,255,.07);
  background:rgba(16,16,16,.34);color:#777;border-radius:999px;
  padding:7px 10px;font-size:9px;backdrop-filter:blur(14px)
}
.loading-overlay{
  position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.38);backdrop-filter:blur(2px);
  pointer-events:none;opacity:0;visibility:hidden;transition:.15s ease
}
.loading-overlay.show{opacity:1;visibility:visible}
.spinner{
  width:24px;height:24px;border-radius:50%;
  border:2px solid rgba(255,255,255,.14);border-top-color:#fff;
  animation:spin .7s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.page-loader{
  display:flex;align-items:center;justify-content:center;gap:8px;
  color:#777;font-size:10px;padding:30px
}
.page-loader .spinner{width:16px;height:16px}
.auth-modal{
  width:min(420px,100%);background:rgba(13,13,13,.92);
  border:1px solid rgba(255,255,255,.1);border-radius:20px;
  padding:20px;box-shadow:0 28px 90px rgba(0,0,0,.7);
  backdrop-filter:blur(24px)
}
.auth-modal h2{font-size:18px;margin:0 0 6px}
.auth-modal p{font-size:10px;color:#858585;line-height:1.5;margin:0 0 16px}
.auth-modal .field{margin-top:10px}
.auth-modal .field input{
  background:rgba(255,255,255,.045);backdrop-filter:blur(12px)
}
.auth-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.auth-actions button{
  border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:9px 12px;
  background:rgba(255,255,255,.06);color:#eee;cursor:pointer
}
.auth-actions .primary{background:#f2f2f2;color:#111}
.post-badge{
  position:absolute;right:10px;top:10px;z-index:5;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.42);backdrop-filter:blur(10px);
  border-radius:999px;padding:4px 7px;font-size:8px;color:#aaa
}
.viewer-post{
  width:100%;margin-top:8px;border:1px solid rgba(255,255,255,.1);
  background:#f1f1f1;color:#111;border-radius:11px;padding:9px;font-weight:700;cursor:pointer
}
.viewer-post.locked{background:#111;color:#666}
@media(max-width:780px){
  .auth-chip{top:7px;right:8px}
  .private-pill{display:none}
}


/* ===== rail cleanup ===== */
.rail .brand-button,
.rail .nav-icon,
.rail .utility-btn{
  background:transparent!important;
  border:0!important;
  box-shadow:none!important;
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
}
.rail .brand-button:hover,
.rail .nav-icon:hover,
.rail .utility-btn:hover{
  background:transparent!important;
  border:0!important;
  color:#fff;
}
.rail .nav-icon{
  border-radius:0!important;
}
.rail .nav-icon.active{
  color:#fff!important;
}
.rail .nav-icon:not(.active){
  color:#777!important;
}
.rail .nav-icon:not(.active):hover{
  color:#d9d9d9!important;
}

/* clean white SD2.5 mark at the true top-left */
.rail{
  padding-top:6px!important;
}
.rail .brand-button{
  width:42px!important;
  height:38px!important;
  margin-bottom:45px!important;
  padding:0!important;
  display:grid!important;
  place-items:center!important;
}
.rail .brand-button .logo-mark{
  width:27px!important;
  height:27px!important;
  background:#fff!important;
  opacity:1!important;
}

/* composer/profile circles keep the translucent blur, but without a harsh ring */
.circle-btn,
.profile-edit,
.back-btn{
  border-color:rgba(255,255,255,.035)!important;
  background:rgba(22,22,22,.30)!important;
  box-shadow:none!important;
}


/* ===== standalone local auth ===== */
.local-auth-note{
  margin:0 0 12px;padding:9px 10px;border-radius:10px;
  border:1px solid rgba(255,255,255,.075);
  background:rgba(255,255,255,.035);
  color:#888;font-size:9px;line-height:1.45
}
.local-auth-tabs{
  display:grid;grid-template-columns:1fr 1fr;gap:4px;
  padding:4px;background:rgba(255,255,255,.035);border-radius:12px;margin:12px 0
}
.local-auth-tab{
  border:0;background:transparent;color:#707070;border-radius:9px;
  padding:8px;font-size:10px;font-weight:750;cursor:pointer
}
.local-auth-tab.active{background:rgba(255,255,255,.075);color:#f1f1f1}
.local-auth-error{
  margin-top:10px;padding:8px 9px;border-radius:9px;
  border:1px solid rgba(255,90,90,.12);
  background:rgba(255,70,70,.05);color:#c99494;font-size:9px;line-height:1.4
}
.auth-submit-local{
  width:100%;margin-top:13px;border:0;border-radius:11px;
  background:#f1f1f1;color:#111;padding:11px 12px;
  font-size:11px;font-weight:800;cursor:pointer
}
.auth-submit-local:disabled{opacity:.45;cursor:wait}


/* ===== SD2.5 generation presentation v2 ===== */
.tile{
  background:#000!important;
}
.tile-media{
  aspect-ratio:9/16!important;
  background:#000!important;
  display:flex;
  align-items:center;
  justify-content:center;
}
.preview-stage{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  overflow:hidden;
}
.preview-content{
  width:100%;
  aspect-ratio:var(--source-ratio,9/16);
  max-height:100%;
  flex:0 0 auto;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at var(--x1,28%) var(--y1,22%),var(--c1,#7c5f42) 0 4%,transparent 26%),
    radial-gradient(circle at var(--x2,72%) var(--y2,68%),var(--c2,#2f6f71) 0 5%,transparent 30%),
    linear-gradient(var(--deg,145deg),var(--c3,#161616),var(--c4,#4d4d4d));
}
.preview-content::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.5),transparent 34%);
  pointer-events:none;
}
.tile[data-scene="1"] .preview-content{
  background:
  radial-gradient(ellipse at 53% 70%,rgba(226,191,119,.64) 0 9%,transparent 10%),
  radial-gradient(ellipse at 50% 48%,rgba(130,92,48,.8) 0 14%,transparent 15%),
  linear-gradient(180deg,#eef0ec 0 35%,#b8b8b2 36% 43%,#5f513a 44% 70%,#26231e);
}
.tile[data-scene="2"] .preview-content{
  background:
  radial-gradient(circle at 68% 20%,#f2e1a4 0 7%,transparent 8%),
  linear-gradient(180deg,#050508 0 38%,#1d1a20 39% 58%,#392c2a 59% 100%);
}
.tile[data-scene="3"] .preview-content{
  background:
  linear-gradient(90deg,transparent 47%,rgba(229,239,242,.86) 48% 53%,transparent 54%),
  linear-gradient(180deg,#b4d8eb 0 31%,#6a8cab 32% 50%,#243144 51% 100%);
}
.tile[data-scene="4"] .preview-content{
  background:
  radial-gradient(ellipse at 72% 77%,#c8b08a 0 9%,transparent 10%),
  radial-gradient(ellipse at 48% 56%,#d9c8b6 0 15%,transparent 16%),
  linear-gradient(155deg,#f2f0e8 0 45%,#b6a07e 46% 65%,#403b31);
}
.tile[data-scene="5"] .preview-content{
  background:
  radial-gradient(circle at 50% 46%,rgba(255,95,29,.72) 0 7%,transparent 24%),
  linear-gradient(180deg,#08090d 0 36%,#2f0905 37% 72%,#17100b);
}
.tile[data-scene="6"] .preview-content{
  background:
  linear-gradient(180deg,#1c1b1e 0 45%,#888 46% 47%,#232323 48% 100%),
  repeating-linear-gradient(90deg,transparent 0 6%,rgba(255,255,255,.06) 7% 8%);
}
.tile[data-scene="7"] .preview-content{
  background:
  radial-gradient(circle at 40% 68%,rgba(244,152,178,.34) 0 12%,transparent 13%),

/* Generation placeholder: black square + faint border + swirly spinner */
.generation-shell{
  position:absolute;
  inset:0;
  z-index:8;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:17px;
  background:#000;
}
.generation-swirl-box{
  width:88px;
  height:88px;
  border:1px solid rgba(255,255,255,.09);
  background:#050505;
  border-radius:12px;
  display:grid;
  place-items:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.012);
}
.generation-swirl{
  position:relative;
  width:42px;
  height:42px;
  animation:swirlRotate 1.4s linear infinite;
}
.generation-swirl::before,
.generation-swirl::after{
  content:"";
  position:absolute;
  border-radius:50%;
  inset:3px;
  border:2px solid transparent;
}
.generation-swirl::before{
  border-top-color:rgba(255,255,255,.82);
  border-right-color:rgba(255,255,255,.22);
  transform:rotate(18deg);
}
.generation-swirl::after{
  inset:10px;
  border-bottom-color:rgba(255,255,255,.45);
  border-left-color:rgba(255,255,255,.10);
  animation:swirlInner .9s linear infinite reverse;
}
.generation-swirl i{
  position:absolute;
  left:50%;
  top:50%;
  width:8px;
  height:8px;
  margin:-4px;
  border-radius:50%;
  background:rgba(255,255,255,.82);
  box-shadow:0 0 18px rgba(255,255,255,.16);
}
@keyframes swirlRotate{to{transform:rotate(360deg)}}
@keyframes swirlInner{to{transform:rotate(360deg)}}

.generation-status-wrap{
  width:min(190px,72%);
  display:flex;
  flex-direction:column;
  gap:7px;
  text-align:center;
}
.generation-status-line{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:#929292;
  font-size:9px;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.generation-status-line strong{
  color:#ededed;
  font-size:9px;
  font-weight:750;
  letter-spacing:.08em;
}
.generation-progress{
  height:3px;
  border-radius:99px;
  overflow:hidden;
  background:rgba(255,255,255,.08);
}
.generation-progress i{
  display:block;
  height:100%;
  width:var(--p,8%);
  background:rgba(255,255,255,.72);
  border-radius:inherit;
  transition:width .7s var(--ease);
}
.status-badge{
  position:absolute;
  z-index:10;
  top:9px;
  right:9px;
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px 7px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.52);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:#aaa;
  font-size:8px;
  text-transform:uppercase;
  letter-spacing:.08em;
}
.status-badge::before{
  content:"";
  width:5px;
  height:5px;
  border-radius:50%;
  background:#777;
}
.status-badge.complete::before{background:#e8e8e8}
.status-badge.generating::before,
.status-badge.preparing::before,
.status-badge.finalizing::before{
  animation:statusPulse 1s ease-in-out infinite alternate;
}
@keyframes statusPulse{from{opacity:.25}to{opacity:1}}

.tile-overlay{
  z-index:12!important;
}
.tile-topmark{
  z-index:12!important;
}

/* force vertical card previews at all widths */
@media(max-width:470px){
  .tile-media{aspect-ratio:9/16!important}
}


/* ===== persistent drafts + truthful result states ===== */
.drafts-grid{
  grid-template-columns:repeat(4,minmax(150px,1fr))!important;
}
.draft{
  aspect-ratio:9/16!important;
  background:#000!important;
  border:1px solid rgba(255,255,255,.055)!important;
  position:relative;
  overflow:hidden;
}
.draft-preview-stage{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
}
.draft-preview-content{
  width:100%;
  aspect-ratio:var(--source-ratio,9/16);
  max-height:100%;
  background:
    radial-gradient(circle at 35% 28%,var(--c1,#6c625c) 0 6%,transparent 25%),
    radial-gradient(circle at 70% 68%,var(--c2,#455d64) 0 7%,transparent 28%),
    linear-gradient(145deg,var(--c3,#141414),var(--c4,#555));
}
.draft-loading{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  background:#000;
}
.draft-loading .generation-swirl-box{
  width:74px;
  height:74px;
}

  width:35px;
  height:35px;
}
.draft-status{
  position:absolute;
  left:8px;
  top:8px;
  z-index:8;

  align-items:center;
  gap:5px;
  padding:5px 7px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.54);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:#aaa;
  font-size:8px;
  letter-spacing:.07em;
  text-transform:uppercase;
}
.draft-status::before{
  content:"";
  width:5px;height:5px;border-radius:50%;
  background:#777;
}
.draft-status.complete::before{background:#eee}
.draft-status.queued::before,
.draft-status.preparing::before,
.draft-status.generating::before,
.draft-status.finalizing::before,
.draft-status.waiting-for-generator::before{
  animation:statusPulse 1s ease-in-out infinite alternate;
}
.draft-progress{
  position:absolute;
  left:8px;
  right:8px;
  bottom:8px;

}
.draft-progress i{
  display:block;

}

@media(max-width:1080px){

/* ===== SD2.5 clean generation state ===== */
.generation-shell,

.clean-status{

<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];

const icons={
 heart:`<svg viewBox="0 0 24 24"><path d="M20 8.3c0 5.1-8 10.2-8 10.2S4 13.4 4 8.3C4 5.9 5.7 4 8.1 4c1.5 0 2.9.8 3.9 2.1C13 4.8 14.4 4 15.9 4 18.3 4 20 5.9 20 8.3Z"/></svg>`,
 comment:`<svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.8 8.8 0 0 1-3.2-.7L4 20l1.5-4A7.2 7.2 0 0 1 4 11.5 7.5 7.5 0 0 1 12 4a7.5 7.5 0 0 1 8 7.5Z"/></svg>`,
 remix:`<svg viewBox="0 0 24 24"><path d="M7 7h8.5A3.5 3.5 0 0 1 19 10.5V12"/><path d="m16 9 3 3 3-3"/><path d="M17 17H8.5A3.5 3.5 0 0 1 5 13.5V12"/><path d="m8 15-3-3-3 3"/></svg>`,
 share:`<svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m8 8 4-4 4 4"/><path d="M5 12v7h14v-7"/></svg>`,
 close:`<svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>`
};

const media=[];

const state={
 route:"feed",
 liked:new Set(),
 attachments:[],
 profileTab:"posts",
 searchFilter:"all",
 generationCounter:0,
 loggedIn:false,
 username:"",
 selectedCameoId:""
};


function normalizedSourceRatio(ratio){
 const r=String(ratio||"9/16").replace(":","/");
 const parts=r.split("/").map(Number);
 if(parts.length!==2 || !parts[0] || !parts[1]) return "9 / 16";
 return `${parts[0]} / ${parts[1]}`;
}
function statusClass(status=""){
 return String(status).trim().toLowerCase().replace(/\s+/g,"-");
}

function cleanStatusName(status=""){
 const s=String(status||"").toLowerCase();
 if(s==="waiting for generator") return "Waiting";
 if(s==="api error") return "Connection issue";
 if(s==="interrupted") return "Interrupted";
 return String(status||"Processing");
}

function generationLoadingMarkup(m){
 const status=m.status||"Processing";
 const nice=cleanStatusName(status);
 const cls=statusClass(status);
 const progress=Math.max(2,Math.min(100,Number(m.progress)||5));
 let sub="Creating your video";
 if(cls==="queued") sub="Waiting to start";
 else if(cls==="submitting") sub="Sending generation";
 else if(cls==="preparing") sub="Preparing the scene";
 else if(cls==="waiting-for-generator") sub="Waiting for Ark";
 else if(cls==="api-error") sub="Could not reach Ark";
 else if(cls==="interrupted") sub="Old session could not resume";
 else if(cls==="failed") sub="Generation failed";

 return `
   <div class="clean-status ${cls}">
     <span>Status</span><strong>${escapeHtml(nice)}</strong>
   </div>
   <div class="generation-shell">
     <div class="gen-spinner-card">
       <canvas class="gen-swirl-canvas" width="108" height="108" aria-hidden="true"></canvas>
     </div>
     <div class="gen-copy">
       <strong>${escapeHtml(nice)}</strong>
       <span>${escapeHtml(sub)}</span>
       <div class="gen-progress-track"><i style="--p:${progress}%"></i></div>
     </div>
   </div>`;
}

let generationAnimationFrame=0;
function startGenerationSwirls(){
 if(generationAnimationFrame) cancelAnimationFrame(generationAnimationFrame);

 const draw=(time)=>{
   const canvases=$$(".gen-swirl-canvas");
   for(const canvas of canvases){
     const ctx=canvas.getContext("2d");
     if(!ctx)continue;

     const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2;
     ctx.clearRect(0,0,w,h);
     ctx.lineCap="round";

     const t=time*0.001;
     const arms=7;

     // faint inner haze
     const glow=ctx.createRadialGradient(cx,cy,2,cx,cy,37);
     glow.addColorStop(0,"rgba(255,255,255,.075)");
     glow.addColorStop(.45,"rgba(255,255,255,.025)");
     glow.addColorStop(1,"rgba(255,255,255,0)");
     ctx.fillStyle=glow;
     ctx.beginPath();
     ctx.arc(cx,cy,39,0,Math.PI*2);
     ctx.fill();

     // curved rotating comma-like arms
     for(let i=0;i<arms;i++){
       const phase=(i/arms)*Math.PI*2 + t*1.55;
       const alpha=.13 + ((i+1)/arms)*.095;
       const r0=10 + i*.75;
       const r1=24 + i*1.25;

       ctx.strokeStyle=`rgba(235,235,235,${Math.min(.82,alpha)})`;
       ctx.lineWidth=3.2 - i*.19;
       ctx.beginPath();

       for(let s=0;s<=18;s++){
         const u=s/18;
         const r=r0+(r1-r0)*u;
         const bend=phase + u*1.05 + Math.sin(u*Math.PI)*.18;
         const x=cx+Math.cos(bend)*r;
         const y=cy+Math.sin(bend)*r;
         if(s===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
       }
       ctx.stroke();
     }

     // soft center
     ctx.fillStyle="rgba(245,245,245,.72)";
     ctx.beginPath();
     ctx.arc(cx,cy,3.2,0,Math.PI*2);
     ctx.fill();
   }
   generationAnimationFrame=requestAnimationFrame(draw);
 };
 generationAnimationFrame=requestAnimationFrame(draw);
}


function fmt(n){
 if(n>=1000) return (n/1000).toFixed(n>=10000?0:1).replace(".0","")+"K";
 return String(n);
}

function watermark(){
 return `<div class="tile-topmark"><span class="logo-mark"></span><span>SD2.5</span></div>`;
}

function tileHTML(m,{profile=false}={}){
 const liked=state.liked.has(mediaKey(m.id));
 const sourceRatio=normalizedSourceRatio(m.ratio);
 const pending=!!m.status;
 const hasResult=!!(m.videoUrl||m.resultUrl);

 return `<article class="tile ${pending?"is-pending":""}" data-id="${m.id}" data-scene="${m.scene||1}">
   <div class="tile-media">
     <div class="preview-stage">
       ${pending
         ? generationLoadingMarkup(m)
         : (m.videoUrl
             ? `<video class="result-video" src="${escapeHtml(m.videoUrl)}" muted playsinline preload="metadata" style="aspect-ratio:${sourceRatio};max-height:100%;object-fit:contain"></video>`
             : `<div class="preview-content" style="--source-ratio:${sourceRatio};--c1:${m.c1};--c2:${m.c2};--c3:${m.c3};--c4:${m.c4}"></div>`
           )
       }
     </div>

     ${pending?"":watermark()}
     ${m.isGlobal?`<div class="global-badge">public</div>`:(m.posted?`<div class="post-badge">posted</div>`:"")}
     ${(!pending&&hasResult)?`<div class="status-badge complete">COMPLETE</div><div class="external-view-hint">View</div>`:""}

     ${pending?"":`
       <div class="tile-overlay">
         <div class="creator">${m.user}</div>
         <div class="tile-actions">
           <button class="mini-action like-btn ${liked?"liked":""}" data-like="${m.id}">${icons.heart}<span>${fmt(m.likes+(liked?1:0))}</span></button>
           <button class="mini-action comment-btn" data-comment="${m.id}">${icons.comment}<span>${fmt(m.comments)}</span></button>
           <button class="mini-action remix-btn" data-remix="${m.id}">${icons.remix}<span>${fmt(m.remixes)}</span></button>

}
function makeEditToken(){

 crypto.getRandomValues(bytes);
 return [...bytes].map(b=>b.toString(16).padStart(2,"0")).join("");

async function globalApi(url,options={}){
 const res=await fetch(url,{
   ...options,
   headers:{
     ...(options.body?{"Content-Type":"application/json"}:{}),
     ...(options.headers||{})
   }
 });
 const text=await res.text();
 let data=null;
 try{data=text?JSON.parse(text):null}catch{data={message:text}}
 if(!res.ok)throw new Error(data?.error||data?.message||`Request failed (${res.status})`);
 return data;
}
async function loadGlobalFeed({quiet=false}={}){
 if(!quiet){
   globalFeedLoading=true;
   globalFeedError="";
   renderFeed();
 }
 try{
   const data=await globalApi("/api/feed");
   const posts=Array.isArray(data?.posts)?data.posts:[];
   globalFeed=posts.map(p=>({
     ...p,
     id:`global-${p.publicPostId}`,
     publicPostId:p.publicPostId,
     videoUrl:p.videoUrl,
     resultUrl:p.videoUrl,
     posted:true,
     isGlobal:true,
     likes:Number(p.likes)||0,
     comments:Number(p.comments)||0,
     remixes:Number(p.remixes)||0
   }));
   globalFeedError="";
 }catch(err){

async function publishGlobal(m){
 if(!m?.videoUrl&&!m?.resultUrl)throw new Error("This video is not ready.");
 const editToken=m.publicEditToken||makeEditToken();
 const p=getCurrentProfile();
 const body={
   sourceVideoUrl:absoluteUrl(m.videoUrl||m.resultUrl),
   localId:String(m.id),
   user:p.handle,
   displayName:p.displayName,
   prompt:m.prompt||"",
   ratio:m.ratio||"9/16",
   kind:m.kind||"generation",
   createdAt:m.createdAt||Date.now(),
   editToken
 };
 const result=await globalApi("/api/publish",{
   method:"POST",
   body:JSON.stringify(body)
 });
 m.publicPostId=result.publicPostId;
 m.publicEditToken=editToken;
 m.posted=true;
 m.user=p.handle;
 m.ownerUsername=state.username||m.ownerUsername||"";
 saveLocal();

 await fetch("/api/cache-video",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
     publicPostId:result.publicPostId,
     sourceVideoUrl:body.sourceVideoUrl,
     editToken
   })
 }).catch(()=>{});

 setTimeout(()=>loadGlobalFeed({quiet:true}),1800);
 return result;
}
async function unpublishGlobal(m){
 if(!m?.publicPostId||!m?.publicEditToken){
   m.posted=false;
   saveLocal();
   return;
 }
 await globalApi(`/api/publish?id=${encodeURIComponent(m.publicPostId)}`,{
   method:"DELETE",
   body:JSON.stringify({editToken:m.publicEditToken})
 });
 m.posted=false;
 delete m.publicPostId;
 delete m.publicEditToken;
 saveLocal();
 await loadGlobalFeed({quiet:true});
}

 ];
 if(cameo && absoluteUrl(cameo.url)!==sourceUrl){
   content.push({type:"video_url",video_url:{url:absoluteUrl(cameo.url)},role:"reference_video"});
 }

 const localId=Date.now();
 const rec={
   id:localId,
   user:source.user||"private",
   ownerUsername:source.ownerUsername||"",
   likes:0,comments:0,remixes:0,posted:false,
   ratio:source.ratio||"adaptive",

   cameoId:cameoId||"",
   c1:"#222",c2:"#333",c3:"#111",c4:"#555",
   status:"Submitting",progress:5,createdAt:Date.now()
 };
 generatedMedia.unshift(rec);
 saveLocal();
 renderAll();

 try{
   const payload={
     model:"doubao-seedance-2-5-260628",
     content,
     resolution:"720p",
     ratio:"adaptive",
     duration:-1,
     generate_audio:true,
     watermark:false,
     output_format:"mp4"
   };
   const task=await arkRequest(ARK_BASE,{method:"POST",body:JSON.stringify(payload)});
   const taskId=task?.id||task?.task_id;
   if(!taskId)throw new Error("Ark returned no task id.");
   rec.taskId=taskId;rec.status="Queued";rec.progress=12;saveLocal();renderAll();
   closeViewerModal();
   toast("Remix submitted");

function loadLocal(){

   const saved=JSON.parse(localStorage.getItem("sd25_demo_private_generations")||"[]");
   if(Array.isArray(saved)){
     generatedMedia=saved.map(item=>{
       // Previous demo builds deleted status after a timer, even with no video.
       // Repair those false-complete jobs.
       if(!item.status && !item.videoUrl && !item.resultUrl){
         return {...item,status:"Interrupted",progress:0};
       }
       return item;
     });
     localStorage.setItem("sd25_demo_private_generations",JSON.stringify(generatedMedia));
   }
 }catch{}
 restoreLocalSession();
}

async function arkRequest(url,options={}){
 const key=getArkKey();
 if(!key) throw new Error("No Ark API key saved. Open Ark API settings first.");

 const headers={
   "Authorization":`Bearer ${key}`,
   ...(options.body?{"Content-Type":"application/json"}:{}),
   ...(options.headers||{})
 };

 const res=await fetch(url,{...options,headers});
 let data=null;
 const text=await res.text();
 try{data=text?JSON.parse(text):null}catch{data={message:text}}

 if(!res.ok){
   const msg=data?.error?.message||data?.message||data?.error||`Ark request failed (${res.status})`;
   throw new Error(typeof msg==="string"?msg:JSON.stringify(msg));
 }
 return data;
}

function arkContentForPrompt(promptText){

function buildArkPayload(promptText){
 const cameo=selectedCameo();
 const content=[];
 let text=promptText;

 if(cameo){
   text=`Use [Video 1] as the cameo/subject reference. ${promptText}`;
 }
 content.push({type:"text",text});
 if(cameo){
   content.push({
     type:"video_url",
     video_url:{url:cameo.url},
     role:"reference_video"
   });
 }

 const payload={
   model:$("#model").value,
   content,
   resolution:$("#resolution").value,
   ratio:$("#ratio").value,
   duration:Number($("#duration").value),
   generate_audio:true,
   watermark:false,
   output_format:"mp4"
 };
 return payload;
}

function mapArkStatus(status){
 const s=String(status||"").toLowerCase();
 if(s==="queued") return ["Queued",12];
 if(s==="running") return ["Generating",58];
 if(s==="succeeded") return ["Complete",100];
 if(s==="failed") return ["Failed",100];
 if(s==="cancelled") return ["Cancelled",100];
 if(s==="expired") return ["Expired",100];
 return [status||"Processing",35];
}

function extractArkVideoUrl(task){
 return task?.content?.video_url
   || task?.output?.video_url
   || task?.video_url
   || task?.result?.video_url
   || "";
}

async function pollArkTask(localId,taskId){
 let attempts=0;
 while(attempts<360){
   attempts++;
   const record=generatedMedia.find(x=>x.id===localId);
   if(!record)return;

   try{
     const task=await arkRequest(`${ARK_BASE}/${encodeURIComponent(taskId)}`,{method:"GET"});
     record.rawStatus=task?.status||"";
     const [uiStatus,progress]=mapArkStatus(task?.status);
     record.status=uiStatus;
     record.progress=progress;
     record.updatedAt=Date.now();

     const videoUrl=extractArkVideoUrl(task);
     if(videoUrl){
       record.videoUrl=videoUrl;
       record.resultUrl=videoUrl;
     }

     saveLocal();
     renderAll();

     const status=String(task?.status||"").toLowerCase();
     if(status==="succeeded"){
       delete record.status;
       record.progress=100;
       record.completedAt=Date.now();
       saveLocal();
       renderAll();
       toast("Generation complete");
       return;
     }
     if(["failed","cancelled","expired"].includes(status)){
       record.status=uiStatus;
       record.error=task?.error?.message||task?.message||"Generation did not complete.";
       saveLocal();
       renderAll();
       toast(`Generation ${uiStatus.toLowerCase()}`);
       return;
     }
   }catch(err){
     record.status="API error";
     record.error=err.message;
     saveLocal();
     renderAll();
     toast("Ark status check failed");
     return;
   }

   await new Promise(r=>setTimeout(r,5000));
 }
}

const LOCAL_USERS_KEY="sd25_local_users_v1";
const LOCAL_SESSION_KEY="sd25_local_session_v1";

function bytesToHex(bytes){
 return [...new Uint8Array(bytes)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function hexToBytes(hex){
 const out=new Uint8Array(hex.length/2);
 for(let i=0;i<out.length;i++) out[i]=parseInt(hex.slice(i*2,i*2+2),16);
 return out;
}
function randomHex(size=16){
 const bytes=new Uint8Array(size);
 crypto.getRandomValues(bytes);
 return bytesToHex(bytes);
}
async function derivePasswordHash(password,saltHex,iterations=120000){
 const enc=new TextEncoder();
 const key=await crypto.subtle.importKey(
   "raw",enc.encode(password),"PBKDF2",false,["deriveBits"]
 );
 const bits=await crypto.subtle.deriveBits({
   name:"PBKDF2",
   salt:hexToBytes(saltHex),
   iterations,
   hash:"SHA-256"
 },key,256);
 return bytesToHex(bits);
}
function getLocalUsers(){
 try{
   const data=JSON.parse(localStorage.getItem(LOCAL_USERS_KEY)||"{}");
   return data && typeof data==="object" ? data : {};
 }catch{return {}}
}
function setLocalUsers(users){
 localStorage.setItem(LOCAL_USERS_KEY,JSON.stringify(users));
}
function normalizeUsername(name){
 return name.trim().toLowerCase();
}
function setLocalSession(username){
 localStorage.setItem(LOCAL_SESSION_KEY,username);
 state.loggedIn=true;
 state.username=username;
 syncAuthUI();
 renderAll();
}
function clearLocalSession(){
 localStorage.removeItem(LOCAL_SESSION_KEY);
 state.loggedIn=false;
 state.username="";
 syncAuthUI();
 renderAll();
}
function restoreLocalSession(){
 const username=localStorage.getItem(LOCAL_SESSION_KEY)||"";
 const users=getLocalUsers();
 if(username && users[username]){
   state.loggedIn=true;
   state.username=username;
 }else{
   state.loggedIn=false;
   state.username="";
 }
 syncAuthUI();
}

function openLogin(initialMode="login"){
 let mode=initialMode==="signup"?"signup":"login";
 $("#modalRoot").innerHTML=`
 <div class="modal-backdrop" id="authBackdrop">
   <div class="auth-modal">
     <div class="auth-brand">
       <span class="logo-mark"></span>
       <div class="auth-brand-copy">
         <div class="auth-brand-title">SD2.5</div>
         <div class="auth-brand-sub">local browser account</div>
       </div>
     </div>

     <div class="local-auth-note">
       This account exists only in this browser on this device. It is meant for a small/demo deployment, not secure multi-device authentication.
     </div>

     <div class="local-auth-tabs">
       <button class="local-auth-tab ${mode==="login"?"active":""}" data-local-auth-mode="login">Log in</button>
       <button class="local-auth-tab ${mode==="signup"?"active":""}" data-local-auth-mode="signup">Create account</button>
     </div>

     <div class="field">
       <label>username</label>
       <input id="localAuthUser" autocomplete="username" maxlength="24" placeholder="username">
     </div>

     <div class="field" style="margin-top:10px">
       <label>password</label>
       <input id="localAuthPass" type="password" autocomplete="${mode==="signup"?"new-password":"current-password"}" placeholder="••••••••">
     </div>

     <div id="localAuthConfirmWrap" class="field ${mode==="signup"?"":"hidden"}" style="margin-top:10px">
       <label>confirm password</label>
       <input id="localAuthConfirm" type="password" autocomplete="new-password" placeholder="••••••••">
     </div>

     <button id="localAuthSubmit" class="auth-submit-local">${mode==="signup"?"Create account":"Log in"}</button>
     <div id="localAuthError" class="local-auth-error hidden"></div>

     <div class="auth-footer-row">
       <button id="authCancel" class="auth-link">Continue as guest</button>
       <button id="clearLocalAccounts" class="auth-link">Reset local accounts</button>
     </div>
   </div>
 </div>`;

 const err=$("#localAuthError");
 const showErr=msg=>{
   err.textContent=msg||"";
   err.classList.toggle("hidden",!msg);
 };
 const setMode=next=>{
   mode=next;
   $$("[data-local-auth-mode]").forEach(b=>b.classList.toggle("active",b.dataset.localAuthMode===next));
   $("#localAuthConfirmWrap").classList.toggle("hidden",next!=="signup");
   $("#localAuthSubmit").textContent=next==="signup"?"Create account":"Log in";
   $("#localAuthPass").autocomplete=next==="signup"?"new-password":"current-password";
   showErr("");
 };
 $$("[data-local-auth-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.localAuthMode));
 $("#authCancel").onclick=closeModal;
 $("#authBackdrop").onclick=e=>{if(e.target.id==="authBackdrop")closeModal()};

 $("#localAuthSubmit").onclick=async()=>{
   if(!window.crypto?.subtle){
     showErr("This browser does not support Web Crypto. Use the HTTPS Netlify version.");
     return;
   }

   const username=normalizeUsername($("#localAuthUser").value);
   const password=$("#localAuthPass").value;
   const confirm=$("#localAuthConfirm")?.value||"";

   if(!/^[a-z0-9_.-]{3,24}$/.test(username)){
     showErr("Username must be 3–24 characters: letters, numbers, _, . or -");
     return;
   }
   if(password.length<6){
     showErr("Password must be at least 6 characters.");
     return;
   }

   const btn=$("#localAuthSubmit");
   btn.disabled=true;
   btn.textContent=mode==="signup"?"Creating…":"Logging in…";

   try{
     const users=getLocalUsers();

     if(mode==="signup"){
       if(password!==confirm) throw new Error("Passwords do not match.");
       if(users[username]) throw new Error("That username already exists on this device.");

       const salt=randomHex(16);
       const hash=await derivePasswordHash(password,salt);
       users[username]={
         username,
         salt,
         hash,
         iterations:120000,
         createdAt:Date.now()
       };
       setLocalUsers(users);
       setLocalSession(username);
       closeModal();
       toast("Local account created");
     }else{
       const record=users[username];
       if(!record) throw new Error("No local account with that username.");
       const hash=await derivePasswordHash(password,record.salt,record.iterations||120000);
       if(hash!==record.hash) throw new Error("Incorrect password.");

       setLocalSession(username);
       closeModal();
       toast("Logged in");
     }
   }catch(e){
     showErr(e.message||"Login failed.");
   }finally{
     if(document.body.contains(btn)){
       btn.disabled=false;
       btn.textContent=mode==="signup"?"Create account":"Log in";
     }
   }
 };

 $("#clearLocalAccounts").onclick=()=>{
   if(confirm("Delete all SD2.5 local accounts and log out on this browser?")){
     localStorage.removeItem(LOCAL_USERS_KEY);
     clearLocalSession();
     closeModal();
     toast("Local accounts reset");
   }
 };
}

$$("[data-profile-tab]").forEach(b=>b.onclick=()=>{
 state.profileTab=b.dataset.profileTab;
 $$(".profile-tab").forEach(x=>x.classList.toggle("active",x===b));
 renderProfile();
});

$("#searchInput").addEventListener("input",()=>{
 renderSearch();
 const q=$("#searchInput").value.trim();
 const box=$("#searchSuggestions");
 if(!q){box.classList.add("hidden");return}
 box.innerHTML=[`Search posts for “${escapeHtml(q)}”`].map(x=>`<div class="suggestion">${x}</div>`).join("");
 box.classList.remove("hidden");
 $$(".suggestion").forEach(s=>s.onclick=()=>{box.classList.add("hidden");renderSearch()});
});
$$("[data-filter]").forEach(b=>b.onclick=()=>{
 state.searchFilter=b.dataset.filter;
 $$(".filter-chip").forEach(x=>x.classList.toggle("active",x===b));
 renderSearch();
});

const prompt=$("#prompt"),send=$("#sendBtn");
function syncPrompt(){
 prompt.style.height="auto";
 prompt.style.height=Math.min(prompt.scrollHeight,120)+"px";
 send.classList.toggle("ready",!!prompt.value.trim());
}
prompt.addEventListener("input",syncPrompt);

$("#attachBtn").onclick=()=>$("#attachInput").click();
$("#attachInput").addEventListener("change",()=>{
 for(const f of $("#attachInput").files){
   state.attachments.push({name:f.name,type:f.type,size:f.size});
 }
 $("#attachInput").value="";
 renderAttachments();
});
function renderAttachments(){
 $("#attachments").innerHTML=state.attachments.map((f,i)=>`<div class="attach-chip"><span>${escapeHtml(f.name)}</span><button data-remove-attach="${i}">×</button></div>`).join("");
 $$("[data-remove-attach]").forEach(b=>b.onclick=()=>{state.attachments.splice(Number(b.dataset.removeAttach),1);renderAttachments()});
}

$("#settingsBtn").onclick=()=>{
 const pop=$("#settingsPopover");
 pop.classList.toggle("hidden");
 if(!pop.classList.contains("hidden")){
   const r=$("#settingsBtn").getBoundingClientRect(),w=Math.min(330,innerWidth-28);
   pop.style.width=w+"px";
   pop.style.left=Math.max(14,Math.min(innerWidth-w-14,r.right-w))+"px";
   pop.style.bottom=(innerHeight-r.top+10)+"px";
 }
};
document.addEventListener("click",e=>{
 if(!e.target.closest("#settingsPopover")&&!e.target.closest("#settingsBtn"))$("#settingsPopover").classList.add("hidden");
});

async function generate(){
 const text=prompt.value.trim();
 if(!text)return;

 const key=getArkKey();
 if(!key){
   toast("Ark API key is not configured");
   return;
 }

 state.generationCounter++;
 const id=Date.now()+state.generationCounter;

 const g={
   id,
   user:state.loggedIn?currentCreatorHandle():"private",
   ownerUsername:state.loggedIn?state.username:"",
   cameoId:state.selectedCameoId||"",
   likes:0,
   comments:0,
   remixes:0,
   posted:false,
   ratio:$("#ratio").value.replace(":","/"),
   scene:(state.generationCounter%12)+1,
   prompt:text,
   c1:"#7b6b61",
   c2:"#4d6871",
   c3:"#131313",
   c4:"#555",
   status:"Submitting",
   progress:5,
   createdAt:Date.now()
 };

 generatedMedia.unshift(g);
 saveLocal();

 prompt.value="";
 state.attachments=[];
 renderAttachments();
 syncPrompt();
 $("#composer").classList.add("subdued");
 setRoute("drafts");
 renderAll();

 try{
   const payload=buildArkPayload(text);
   const task=await arkRequest(ARK_BASE,{
     method:"POST",
     body:JSON.stringify(payload)
   });

   const taskId=task?.id||task?.task_id;
   if(!taskId) throw new Error("Ark created a task but returned no task id.");

   g.taskId=taskId;
   g.status="Queued";
   g.progress=12;
   g.updatedAt=Date.now();
   saveLocal();
   renderAll();

   $("#composer").classList.remove("subdued");
   toast("Generation submitted");
   pollArkTask(id,taskId);
 }catch(err){
   g.status="API error";
   g.error=err.message;
   g.progress=100;
   saveLocal();
   renderAll();
   $("#composer").classList.remove("subdued");
   toast("Generation request failed");
 }
}
$("#sendBtn").onclick=generate;
prompt.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter")generate()});

$("#feedSelector").onclick=()=>toast("For You · everyone");
if($("#refreshFeedBtn"))$("#refreshFeedBtn").onclick=()=>loadGlobalFeed();

$("#moreBtn").onclick=()=>toast(state.loggedIn?"Account options":"Private mode");


function resumeArkJobs(){
 if(!getArkKey())return;
 for(const job of generatedMedia){
   if(job.taskId && !job.videoUrl && !job.resultUrl && !["Failed","Cancelled","Expired","API error"].includes(job.status)){
     pollArkTask(job.id,job.taskId);
   }
 }
}

function renderAll(){
 renderFeed();renderSearch();renderActivity();renderProfile();renderDrafts();renderCameos();refreshCameoSelect();
}
loadLocal();
loadCameos();
refreshCameoSelect();
renderAll();
syncPrompt();
loadGlobalFeed();
setTimeout(resumeArkJobs,250);
setInterval(()=>loadGlobalFeed({quiet:true}),20000);

function openViewerFromHash(){
 const raw=location.hash.slice(1);
 if(!raw.startsWith("view-"))return false;
 const key=decodeURIComponent(raw.slice(5));
 const m=findAnyMedia(key);
 if(m&&!m.status&&(m.videoUrl||m.resultUrl)){
   openImmersiveViewer(m);
   return true;
 }
 return false;
}
function syncRouteFromHash(){
 if(location.hash.startsWith("#view-")){
   if($("#immersiveViewer").classList.contains("hidden")){
     openViewerFromHash();
   }
   return;
 }

 if(!$("#immersiveViewer").classList.contains("hidden")){
   const requested=location.hash.slice(1)||"feed";
   const safe=["feed","search","activity","profile","cameos","drafts"].includes(requested)?requested:"feed";
   document.body.classList.remove("viewer-open");
   $("#immersiveViewer").classList.add("hidden");
   currentViewerId=null;
   setRoute(safe,false);
   return;
 }

 const requested=location.hash.slice(1)||"feed";
 const safe=["feed","search","activity","profile","cameos","drafts"].includes(requested)?requested:"feed";
 setRoute(safe,false);
}

if(location.hash.startsWith("#view-")){
 setRoute("feed",false);
 setTimeout(openViewerFromHash,80);
}else{
 syncRouteFromHash();
}
window.addEventListener("hashchange",syncRouteFromHash);

setTimeout(()=>$("#splash").classList.add("hide"),420);
</script>
</body>
